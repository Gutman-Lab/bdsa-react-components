name: Publish to npm

# Publishes with npm trusted publishing (OIDC): no npm token is stored in this
# repository or in GitHub secrets. npm exchanges the workflow's OIDC identity
# for a short-lived publish token, and generates provenance automatically.
#
# One-time setup by a package maintainer, on npmjs.com -> Packages ->
# bdsa-react-components -> Settings -> Trusted publishing:
#   Organization or user: Gutman-Lab
#   Repository:           bdsa-react-components
#   Workflow filename:    publish.yml
#   Environment name:     (leave empty)
#   Allowed actions:      enable "Allow npm publish"
# The configuration must complete its first successful publish within 2 days.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "Publishing ${version} for tag ${GITHUB_REF_NAME}"

      - run: npm ci

      - run: npm test

      # prepublishOnly rebuilds dist/ and runs check:exports.
      - run: npm publish
